name: Release images

# En cada tag vX.Y.Z: buildea y publica las imágenes a GitHub Container Registry.
# Usa el GITHUB_TOKEN automático → no requiere secretos externos.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

env:
  BACKEND_IMAGE: ghcr.io/mperezmo/dbaassistant-backend
  FRONTEND_IMAGE: ghcr.io/mperezmo/dbaassistant-frontend

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.ref_name }}

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          # Variables públicas de Vite: configurar como "Repository variables"
          # en GitHub (Settings → Secrets and variables → Actions → Variables).
          build-args: |
            VITE_API_BASE_URL=/api
            VITE_AUTH0_DOMAIN=${{ vars.VITE_AUTH0_DOMAIN }}
            VITE_AUTH0_CLIENT_ID=${{ vars.VITE_AUTH0_CLIENT_ID }}
            VITE_AUTH0_AUDIENCE=${{ vars.VITE_AUTH0_AUDIENCE }}
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.ref_name }}
