# Reverse proxy de producción: punto de entrada único.
#   /        → frontend (SPA estático servido por su propio nginx)
#   /api/    → backend FastAPI (se elimina el prefijo /api)
# El frontend de producción se compila con VITE_API_BASE_URL=/api.
server {
    listen 80;
    server_name _;

    # Tamaño máximo de payload (resultados de queries, etc.)
    client_max_body_size 10m;

    location /api/ {
        proxy_pass         http://backend:8000/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass       http://frontend:80;
        proxy_set_header Host $host;
    }
}
